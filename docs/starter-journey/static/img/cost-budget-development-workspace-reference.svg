<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Development Workspace budget reference</title>
  <desc id="desc">Wireframe showing budget name Development Workspace budget with alert thresholds at 500 and 1000 USD. Replace with account console screenshots.</desc>
  <rect width="100%" height="100%" fill="#f6f7f9"/>
  <rect x="24" y="24" width="672" height="48" rx="6" fill="#ffffff" stroke="#c5c7d0"/>
  <text x="40" y="56" font-family="system-ui,sans-serif" font-size="18" fill="#1b1f23">Budget name: Development Workspace budget</text>
  <rect x="24" y="88" width="672" height="72" rx="6" fill="#ffffff" stroke="#c5c7d0"/>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="15" fill="#57606a">Definitions: scope to dev workspace (and optional tags)</text>
  <text x="40" y="142" font-family="system-ui,sans-serif" font-size="14" fill="#6e7781">Replace this box with a Usage ’ Budgets screenshot from your tenant.</text>
  <rect x="24" y="176" width="320" height="80" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="16" fill="#1b1f23">Alert threshold 1: $500</text>
  <text x="40" y="232" font-family="system-ui,sans-serif" font-size="13" fill="#57606a">Comma-separated emails for first alert</text>
  <rect x="360" y="176" width="336" height="80" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="376" y="208" font-family="system-ui,sans-serif" font-size="16" fill="#1b1f23">Alert threshold 2: $1000</text>
  <text x="376" y="232" font-family="system-ui,sans-serif" font-size="13" fill="#57606a">Second distribution list (optional)</text>
</svg>
