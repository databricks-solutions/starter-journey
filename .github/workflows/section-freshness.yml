name: Section freshness

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-section-freshness:
    name: Check documentation section freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@83679eac221133494b259f329df2035c3ed3f643 # v6.1.0
        with:
          python-version: '3.12'

      - name: Check section freshness
        id: freshness
        run: |
          set -euo pipefail
          python scripts/check_section_freshness.py \
            --report-file stale-sections-report.md
        continue-on-error: true

      - name: Create or update stale-sections issue
        if: steps.freshness.outcome == 'failure'
        uses: actions/github-script@ed597411d8f92433705bb5176aade432f1486621 # v8.0.0
        with:
          script: |
            const fs = require('fs');

            const reportPath = 'stale-sections-report.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Section freshness check failed. See workflow logs.';
            const title = 'Stale documentation sections';
            const label = 'section-freshness';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            async function listContributorLogins() {
              const logins = [];
              let page = 1;
              while (true) {
                const { data } = await github.rest.repos.listContributors({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                  page,
                });
                if (!data.length) break;
                for (const contributor of data) {
                  if (contributor.login && contributor.type !== 'Bot') {
                    logins.push(contributor.login);
                  }
                }
                if (data.length < 100) break;
                page += 1;
              }
              return [...new Set(logins)].sort((a, b) => a.localeCompare(b));
            }

            const contributorLogins = await listContributorLogins();
            const contributorMentions = contributorLogins
              .map((login) => `@${login}`)
              .join(' ');
            const notifyLine = contributorMentions
              ? `**Notifying repo contributors:** ${contributorMentions}`
              : '_No human contributors returned by the API; watch this issue or check Actions._';

            const issueBody = `${report}\n\n---\n\n${notifyLine}\n`;
            const commentBody = [
              `Section freshness check failed ([workflow run](${runUrl})).`,
              '',
              report,
              '',
              '---',
              '',
              notifyLine,
            ].join('\n');

            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (!labels.some((l) => l.name === label)) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: 'Journey section past freshness threshold',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const existing = issues.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: issueBody,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
              core.info(
                `Updated issue #${existing.number} and notified ${contributorLogins.length} contributor(s) via comment`,
              );
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: [label],
              });
              core.info(
                `Created issue #${created.number} and notified ${contributorLogins.length} contributor(s)`,
              );
            }

      - name: Close stale-sections issue when all sections are fresh
        if: steps.freshness.outcome == 'success'
        uses: actions/github-script@ed597411d8f92433705bb5176aade432f1486621 # v8.0.0
        with:
          script: |
            const title = 'Stale documentation sections';
            const label = 'section-freshness';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            for (const issue of issues) {
              if (issue.title === title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed issue #${issue.number}`);
              }
            }

      - name: Fail job if sections are stale
        if: steps.freshness.outcome == 'failure'
        run: exit 1
